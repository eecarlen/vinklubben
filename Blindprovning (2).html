<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Blindprovning</title>
<style>
:root{--bg:#faf7f5;--fg:#2a1f22;--mut:#7a6b6f;--card:#fff;--ln:#e6dcdf;--ac:#7b1e3a;--acf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1416;--fg:#f1e8ea;--mut:#a8979c;--card:#261c1f;--ln:#3d2f33;--ac:#d4617f;--acf:#1b1416}}
:root[data-theme=dark]{--bg:#1b1416;--fg:#f1e8ea;--mut:#a8979c;--card:#261c1f;--ln:#3d2f33;--ac:#d4617f;--acf:#1b1416}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;gap:14px;align-items:center;padding:8px 0 14px}header b{flex:1;font-size:20px}a{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:0 0 12px}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px;color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--acf);cursor:pointer}
button.s{background:none;color:var(--ac)}button.sm{padding:5px 10px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}.mut{color:var(--mut);font-size:14px}.ok{color:var(--ac);font-size:14px}
.num{font-size:26px;font-weight:700;min-width:36px}.ranks{display:flex;gap:6px;flex:1}.ranks button{flex:1;background:none;color:var(--ac)}.ranks button.on{background:var(--ac);color:var(--acf)}
.vn{display:flex;gap:10px;align-items:center;margin-bottom:8px}
img.th{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle}img.big{max-width:100%;max-height:280px;border-radius:8px;display:block;margin:8px 0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}th{color:var(--mut);font-weight:600}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer}.it>div{flex:1;min-width:0}
.chip{font-size:12px;background:var(--ac);color:var(--acf);border-radius:10px;padding:2px 8px;white-space:nowrap}
</style></head><body><div id="app">Laddar…</div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,8);
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const COL={red:'Rött',white:'Vitt',rose:'Rosé',sparkling:'Bubbel'};
const colOpts=(sel)=>Object.entries(COL).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${v}</option>`).join('');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const link=u=>safeUrl(u)?`<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">Systembolaget</a>`:'';
let db,assets,user,admin=false,unsubs=[];
const hdr=()=>`<header><b>🍷 Blindprovning</b><a href="#" onclick="setRole('');location.hash='';return false">Hem</a><a href="#arkiv">Arkiv</a></header>`;
function PV(){try{return sessionStorage.getItem('prev')}catch{}}
function prev(v){try{v?sessionStorage.setItem('prev','1'):sessionStorage.removeItem('prev')}catch{}route()}
const nt=x=>typeof x==='string'?{o:x}:(x||{});
const fmt=o=>{o=nt(o);return[['u','Utseende'],['d','Doft'],['s','Smak'],['o','Övrigt']].filter(([k])=>o[k]).map(([k,l])=>l+': '+o[k]).join(' · ')};
function isAdmin(){return ls.get('role')==='host'}
function setRole(r){ls.set('role',r);if(!r)ls.set('nm','');route()}
async function init(){
 try{db=await claude.use('db');assets=await claude.use('assets');user=await claude.use('user')}catch{}
 if(!db){app.innerHTML=hdr()+'<div class="card">Delad lagring är inte tillgänglig. Öppna sidan via länken i claude.ai.</div>';return}
 admin=isAdmin();route();addEventListener('hashchange',route)}
function route(){unsubs.forEach(u=>{try{u()}catch{}});unsubs=[];admin=isAdmin();const h=location.hash.slice(1);
 if(!ls.get('role')){app.innerHTML=`<div style="padding:36px 0 10px;text-align:center"><div style="font-size:48px">🍷</div><h2>Blindprovning</h2><p class="mut">Hur vill du delta?</p></div><div class="card"><button style="width:100%;padding:16px" onclick="setRole('host')">Jag är host</button><p class="mut">Skapar provningar, drar nummer och avslöjar resultat.</p></div><div class="card"><button class="s" style="width:100%;padding:16px" onclick="setRole('guest')">Jag är gäst</button><p class="mut">Lägger in sitt vin och röstar.</p></div>`;return}
 if(!ls.get('nm')){app.innerHTML=`<div style="padding:30px 0 10px;text-align:center"><h2>Vem är du?</h2></div><div class="card">`+NAMES.map(n=>`<button class="s" style="width:100%;margin:4px 0;padding:14px" onclick="setName('${n}')">${n}</button>`).join('')+`</div><p class="mut" style="text-align:center"><a href="#" onclick="setRole('');return false">Tillbaka</a></p>`;return}
 if(h==='arkiv')archive();else if(h)tasting(h);else home()}

/* HEM */
function home(){
 app.innerHTML=hdr()+'<div id="b"></div>';const b=$('#b');
 if(!admin){b.innerHTML=`<div class="card"><h2>Hej ${esc(me())}! Välj provning</h2><div id="ls" class="mut">Laddar…</div></div><p class="mut">Vill du se gamla viner? Öppna <a href="#arkiv">arkivet</a>.</p>`;
  unsubs.push(db.collection('tastings').orderBy('createdAt','desc').onSnapshot(s=>{const l=s.docs.filter(d=>d.data().status!=='revealed');
   $('#ls').innerHTML=l.length?l.map(d=>{const t=d.data();return `<div class="it" onclick="location.hash='${d.id}'"><div><b>${esc(t.name)}</b><div class="mut">${esc(t.date||'')} · ${t.status==='reg'?'Registrering öppen':'Provning pågår'}</div></div><span class="chip" id="c_${d.id}">…</span></div>`}).join(''):'Ingen pågående provning just nu. Be värden skapa en.';
   l.forEach(async d=>{let has=false;try{has=(await db.doc('tastings/'+d.id+'/wines/'+mk()).get()).exists}catch{}const c=$('#c_'+d.id);if(c)c.textContent=has?'Vin inlagt ✓':'Inget vin ännu'})}));return}
 b.innerHTML=`<div class="card"><h2>Ny vinprovning</h2>
 <label>Namn</label><input id="nm" placeholder="T.ex. Höstprovning"><label>Datum</label><input id="dt" type="date">
 <label>Typ</label><select id="ty"><option value="vanlig">Vanlig (allt slumpas ihop)</option><option value="mix">Mixprovning (två färger)</option></select>
 <div id="mx" class="row" style="display:none"><div><label>Serveras först</label><select id="c1">${colOpts('white')}</select></div><div><label>Serveras sedan</label><select id="c2">${colOpts('red')}</select></div></div>
 <p><button id="mk">Skapa</button></p></div><div class="card"><h2>Provningar</h2><div id="ls" class="mut">Laddar…</div></div>`;
 $('#ty').onchange=e=>$('#mx').style.display=e.target.value==='mix'?'flex':'none';
 $('#mk').onclick=async()=>{const name=$('#nm').value.trim(),ty=$('#ty').value,c1=$('#c1').value,c2=$('#c2').value;
  if(!name)return alert('Ange ett namn');if(ty==='mix'&&c1===c2)return alert('Välj två olika färger');
  const id='t'+rid();await db.doc('tastings/'+id).set({name,date:$('#dt').value,type:ty,c1,c2,status:'reg',createdAt:Date.now()});location.hash=id};
 unsubs.push(db.collection('tastings').orderBy('createdAt','desc').onSnapshot(s=>{
  $('#ls').innerHTML=s.empty?'Inga ännu.':s.docs.map(d=>{const t=d.data();return `<div class="it" onclick="location.hash='${d.id}'"><div><b>${esc(t.name)}</b><div class="mut">${esc(t.date||'')} · ${t.status==='reg'?'Registrering':t.status==='tasting'?'Provning pågår':'Avslöjad'}</div></div><button class="s sm" onclick="event.stopPropagation();delT('${d.id}')">Ta bort</button></div>`}).join('')}))}

/* PROVNING */
const NAMES=['Anna','Carl','Edvin','Elsa','Emma','Hugo','Siri','Victor'];
const me=()=>ls.get('nm')||'',mk=()=>me().toLowerCase();
function setName(n){ls.set('nm',n);route()}
function tasting(id){
 app.innerHTML=hdr()+'<div id="b">Laddar…</div>';
 let T=null,W=[],V=[],loaded=false,lastKey='';const tref=db.doc('tastings/'+id);
 const groups=()=>T.type==='mix'?[{k:'a',c:T.c1},{k:'b',c:T.c2}].map(g=>({...g,nums:W.filter(w=>w.num&&w.color===g.c).map(w=>w.num).sort((a,b)=>a-b)})):[{k:'a',nums:W.filter(w=>w.num).map(w=>w.num).sort((a,b)=>a-b)}];
 const gl=g=>T.type==='mix'?COL[g.c]:'';
 const draw=()=>{const b=$('#b');if(!b)return;
  if(!T){b.innerHTML=loaded?'<div class="card">Provningen hittades inte.</div>':'Laddar…';lastKey='';return}
  const key=T.status+admin+loaded+JSON.stringify(T.rev||{});if(key!==lastKey){lastKey=key;build()}upd()};
 unsubs.push(tref.onSnapshot(s=>{T=s.exists?s.data():null;draw()}));
 unsubs.push(tref.collection('wines').onSnapshot(s=>{W=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;draw()}));
 unsubs.push(tref.collection('votes').onSnapshot(s=>{V=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
 const pour=()=>{const ws=W.filter(w=>w.num).sort((a,b)=>a.num-b.num);let h='';
  (T.type==='mix'?[T.c1,T.c2]:[null]).forEach(c=>{const l=ws.filter(w=>!c||w.color===c);if(!l.length)return;if(c)h+=`<h3>${COL[c]}</h3>`;h+=l.map(w=>`<div>Häll vin nr <b>${w.num}</b> = ${esc(w.name)} <span class="mut">(${esc(w.producer||'')}) · tog med: ${esc(w.by||'')}</span></div>`).join('')});return h};
 const build=()=>{const b=$('#b'),st=T.status;
  let h=`<div class="card"><h2>${esc(T.name)}</h2><div class="mut">${esc(T.date||'')} · ${T.type==='mix'?'Mixprovning: '+COL[T.c1]+' först, sedan '+COL[T.c2].toLowerCase():'Vanlig provning'}</div></div>`;
  if(st==='reg'){
   if(admin)h+=`<div class="card"><h3 style="margin-top:0">Delningslänk</h3><input readonly value="${esc(location.href)}" onclick="this.select()"><p class="mut">Skicka länken till deltagarna.</p><div id="wl"></div><p><button id="lock">Lås registreringen och dra nummer</button></p></div>`;
   h+=`<div class="card"><h2>Lägg till vin</h2><p class="mut">Du lägger in vin som <b>${esc(me())}</b>.</p><p class="ok" id="ws"></p><div id="form"></div></div>`;
   b.innerHTML=h;if(admin)$('#lock').onclick=lock;if(loaded)form();
  }else if(st==='tasting'){
   if(admin)h+=`<div class="card"><h2>Hällningslista</h2><div id="pr"></div><h3>Röstningsstatus</h3><div id="vs"></div><div id="rb"></div></div>`;
   h+=`<div id="res"></div><div id="vote"></div>`;b.innerHTML=h;if(admin)$('#rb').onclick=e=>{const x=e.target.closest('button');if(x)reveal(x.dataset.k)};if(loaded)vote();
  }else b.innerHTML=h+`<div id="res"></div>`};
 const picks=(v,g)=>((v.p||{})[g.k]||[]).map((n,i)=>n?(i+1)+':a nr '+n:'').filter(Boolean).join(', ')||'–';
 const upd=()=>{if(!T)return;
  if(T.status==='reg'){const ws=$('#ws');if(ws)ws.textContent=W.some(w=>w.id===mk())?'✓ Ditt vin är registrerat. Du kan ändra det tills värden låser.':'Du har inte lagt in något vin än.';
   const wl=$('#wl');if(wl)wl.innerHTML=`<h3>${W.length} viner registrerade</h3>`+W.map(w=>`<div>${esc(w.name)} <span class="mut">· ${esc(w.by||'')} · ${COL[w.color]||''}</span> <button class="s sm" onclick="delW('${id}','${w.id}')">Ta bort</button></div>`).join('')}
  if(T.status==='tasting'&&admin&&$('#pr')){const gs=groups();$('#pr').innerHTML=pour();
   $('#rb').innerHTML=T.type==='mix'?gs.filter(g=>g.nums.length&&!(T.rev||{})[g.k]).map(g=>`<button data-k="${g.k}" style="width:100%;margin:4px 0">Avslöja ${COL[g.c].toLowerCase()} (vin ${g.nums[0]}–${g.nums[g.nums.length-1]})</button>`).join(''):'<button data-k="all">Avslöja resultatet</button>';
   const rest=[...new Set(W.map(w=>w.by))].filter(n=>!V.some(v=>v.name===n));
   $('#vs').innerHTML=V.map(v=>`<div><b>${esc(v.name)}</b> <span class="mut">${gs.map(g=>(gl(g)?gl(g)+': ':'')+((v.done||{})[g.k]?'✓ klar':'pågår')+' ('+picks(v,g)+')').join(' · ')}</span></div>`).join('')+(rest.length?`<div class="mut">Har inte börjat: ${esc(rest.join(', '))}</div>`:'')}
  if($('#res'))$('#res').innerHTML=results().filter(x=>T.status==='revealed'||(T.rev||{})[x.g.k]).map(({g,r})=>`<div class="card"><h2>Resultat${gl(g)?' – '+gl(g):''}</h2><div class="sc"><table><tr><th>Plac.</th><th>Vin</th><th>Producent</th><th>Druva</th><th>Pris</th><th>Tog med</th><th>Poäng</th></tr>`+r.map(w=>`<tr><td>${w.rank}${w.tie?'=':''}</td><td>${w.img?`<img class="th" src="${esc(w.img)}"> `:''}<b>${esc(w.name)}</b><br>${link(w.link)}</td><td>${esc(w.producer)}</td><td>${esc(w.grape)}</td><td>${esc(w.price)}</td><td>${esc(w.by)}</td><td><b>${w.pts}</b></td></tr>`).join('')+`</table></div>${r.some(w=>w.tie)?'<p class="mut">= delad placering (lika poäng).</p>':''}</div>`).join('')};
 const results=()=>groups().map(g=>{const pts={};V.forEach(v=>((v.p||{})[g.k]||[]).forEach((n,i)=>{if(n)pts[n]=(pts[n]||0)+3-i}));
  const r=W.filter(w=>g.nums.includes(w.num)).map(w=>({...w,pts:pts[w.num]||0})).sort((a,b)=>b.pts-a.pts||String(a.name).localeCompare(b.name));
  r.forEach((w,i)=>{w.rank=i&&w.pts===r[i-1].pts?r[i-1].rank:i+1;w.tie=r.filter(x=>x.pts===w.pts).length>1});return {g,r}});
 const form=()=>{const {id:_i,...w}=W.find(x=>x.id===mk())||{};let img=w.img||'';const f=$('#form');
  const F=(k,l,t)=>`<label>${l}</label><input id="f_${k}" ${t||''} value="${esc(w[k])}">`;
  f.innerHTML=F('name','Vinets namn')+F('producer','Producent')+F('grape','Druva')+F('region','Land/region')+
  `<div class="row"><div>${F('vintage','Årgång')}</div><div>${F('price','Pris (kr)','inputmode="numeric"')}</div></div><label>Färg</label><select id="f_color">${colOpts(w.color||'red')}</select>
  <label>Anteckning (valfri)</label><textarea id="f_note" rows="2">${esc(w.note)}</textarea><label>Länk till Systembolaget (valfri)</label><input id="f_link" inputmode="url" value="${esc(w.link)}">
  <label>Bild</label><input id="f_img" type="file" accept="image/*"><div id="pv">${img?`<img class="big" src="${esc(img)}">`:''}</div><p><button id="sv">Spara vin</button> <span class="ok" id="msg"></span></p>`;
  $('#f_img').onchange=async e=>{const file=e.target.files[0];if(!file)return;$('#pv').textContent='Laddar upp…';
   try{const bm=await createImageBitmap(file),k=Math.min(1,900/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));const up=await assets.upload(blob);img=up.url;$('#pv').innerHTML=`<img class="big" src="${esc(img)}">`}catch(er){$('#pv').textContent='Kunde inte ladda upp bilden.'}};
  $('#sv').onclick=async()=>{const g=k=>$('#f_'+k).value.trim(),name=g('name');if(!name)return alert('Fyll i vinets namn');
   await tref.collection('wines').doc(mk()).set({...w,name,by:me(),producer:g('producer'),grape:g('grape'),region:g('region'),vintage:g('vintage'),price:g('price'),color:$('#f_color').value,note:g('note'),link:g('link'),img,createdAt:w.createdAt||Date.now()});$('#msg').textContent='Sparat ✓'}};
 const lock=async()=>{const mix=T.type==='mix';let ws=W,warn=[];
  if(mix){const ex=W.filter(w=>w.color!==T.c1&&w.color!==T.c2);if(ex.length)warn.push(ex.length+' vin har en färg utanför mixen och utesluts: '+ex.map(w=>w.name).join(', '));
   [T.c1,T.c2].forEach(c=>{if(!W.some(w=>w.color===c))warn.push('Inga viner av färgen '+COL[c].toLowerCase())});ws=W.filter(w=>w.color===T.c1||w.color===T.c2)}
  if(!ws.length)return alert('Inga viner registrerade');
  if(!await ask((warn.length?warn.join('\n')+'\n\n':'')+'Låsa registreringen och dra nummer? Det går inte att ångra.'))return;
  const order=mix?[...shuffle(ws.filter(w=>w.color===T.c1)),...shuffle(ws.filter(w=>w.color===T.c2))]:shuffle(ws);
  try{await Promise.all(order.map((w,i)=>tref.collection('wines').doc(w.id).update({num:i+1})));await tref.update({status:'tasting'})}catch(e){alert('Kunde inte dra nummer: '+(e.message||e.code||e))}};
 const vote=async()=>{const box=$('#vote'),vref=tref.collection('votes').doc(mk());
  let my={p:{},notes:{},done:{}};try{const s=await vref.get();if(s.exists){const d=s.data();my={p:d.p||{},notes:d.notes||{},done:d.done||{}}}}catch{}
  const gs=groups().filter(g=>g.nums.length&&!(T.rev||{})[g.k]),save=()=>vref.set({name:me(),p:my.p,notes:my.notes,done:my.done});
  gs.forEach(g=>{my.p[g.k]=my.p[g.k]||[null,null,null]});
  box.innerHTML=gs.map(g=>`<div class="card"><h2>${gl(g)?'Din topp 3 – '+gl(g)+' (vin '+g.nums[0]+'–'+g.nums[g.nums.length-1]+')':'Din topp 3'}</h2><p class="mut" id="sum_${g.k}"></p></div>`+g.nums.map(n=>{const o=nt(my.notes[n]);return `<div class="card"><div class="vn"><span class="num">${n}</span><div class="ranks">${['1:a','2:a','3:e'].map((l,r)=>`<button data-g="${g.k}" data-n="${n}" data-r="${r}">${l}</button>`).join('')}</div></div>`+[['u','Utseende'],['d','Doft'],['s','Smak'],['o','Övrigt']].map(([k,l])=>`<label>${l}</label><textarea data-n="${n}" data-k="${k}" rows="1">${esc(o[k])}</textarea>`).join('')+'</div>'}).join('')+`<div class="card" id="dn_${g.k}"></div>`).join('');
  const sync=g=>{box.querySelectorAll(`.ranks button[data-g="${g.k}"]`).forEach(x=>x.classList.toggle('on',my.p[g.k][x.dataset.r]==x.dataset.n));
   $('#sum_'+g.k).textContent='Sparas automatiskt. Vald: '+my.p[g.k].map((n,i)=>(i+1)+':a = '+(n||'–')).join(', ');
   $('#dn_'+g.k).innerHTML=my.done[g.k]?'<p class="ok">✓ Du har röstat klart. Ändrar du något måste du trycka klart igen.</p>':`<button data-d="${g.k}" style="width:100%">Jag har röstat klart</button>`};
  gs.forEach(sync);
  box.onclick=e=>{const x=e.target.closest('button');if(!x)return;
   if(x.dataset.r!==undefined){const g=x.dataset.g,n=+x.dataset.n,r=+x.dataset.r;if(my.p[g][r]===n)my.p[g][r]=null;else{my.p[g]=my.p[g].map(v=>v===n?null:v);my.p[g][r]=n}my.done[g]=false;sync(gs.find(q=>q.k===g));save()}
   else if(x.dataset.d){const g=gs.find(q=>q.k===x.dataset.d);if(my.p[g.k].filter(Boolean).length<Math.min(3,g.nums.length))return alert('Välj din topp 3 först.');my.done[g.k]=true;sync(g);save()}};
  let tm;box.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{const o=my.notes[t.dataset.n]=nt(my.notes[t.dataset.n]);o[t.dataset.k]=t.value;clearTimeout(tm);tm=setTimeout(save,500)})};
 const reveal=async k=>{const gs=groups().filter(g=>k==='all'||g.k===k);if(!await ask(k==='all'?'Avslöja resultatet för alla?':'Avslöja '+COL[gs[0].c].toLowerCase()+' för alla?'))return;
  const rs=results().filter(x=>gs.some(g=>g.k===x.g.k)).flatMap(x=>x.r);
  await Promise.all(rs.map(w=>db.doc('archive/'+w.id+'_'+id).set({name:w.name,producer:w.producer||'',grape:w.grape||'',region:w.region||'',vintage:w.vintage||'',price:w.price||'',color:w.color,by:w.by||'',img:w.img||'',link:w.link||'',tasting:T.name,tid:id,date:T.date||'',rank:w.rank,tie:w.tie,pts:w.pts,notes:V.map(v=>fmt((v.notes||{})[w.num])).filter(Boolean)})));
  const rev={...(T.rev||{})};gs.forEach(g=>rev[g.k]=true);
  await tref.update({rev,status:groups().every(g=>!g.nums.length||rev[g.k])?'revealed':'tasting'})}}

/* ARKIV */
function archive(){
 app.innerHTML=hdr()+`<div class="card"><input id="q" placeholder="Sök vinnamn"><div class="row" style="margin-top:8px"><select id="fg"></select><select id="ft"></select></div><div class="row" style="margin-top:8px"><select id="fc"></select><select id="fr"></select></div>
 <div class="row" style="margin-top:8px"><input id="pa" type="number" placeholder="Pris från"><input id="pb" type="number" placeholder="Pris till"></div>
 <div class="row" style="margin-top:8px"><select id="so"><option value="new">Sortera: Nyast</option><option value="rank">Placering</option><option value="pa">Pris ↑</option><option value="pd">Pris ↓</option><option value="vin">Årgång</option><option value="gr">Druva</option><option value="nm">Namn</option></select></div></div><div id="ls" class="card mut">Laddar…</div>`;
 let A=[],open=null;const val=(k)=>[...new Set(A.map(a=>a[k]).filter(Boolean))].sort();
 const sel=(id,l,vals,lab)=>{const e=$(id),c=e.value;e.innerHTML=`<option value="">${l}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(lab?lab(v):v)}</option>`).join('');e.value=c};
 const render=()=>{const q=$('#q').value.toLowerCase(),g=$('#fg').value,t=$('#ft').value,c=$('#fc').value,r=$('#fr').value,pa=parseFloat($('#pa').value),pb=parseFloat($('#pb').value);
  let l=A.filter(a=>(!q||a.name.toLowerCase().includes(q))&&(!g||a.grape===g)&&(!t||a.tasting===t)&&(!c||a.color===c)&&(!r||a.region===r)&&(isNaN(pa)||+a.price>=pa)&&(isNaN(pb)||+a.price<=pb));
  const s=$('#so').value,n=x=>parseFloat(x)||0;
  l.sort({new:(a,b)=>(b.date||'').localeCompare(a.date||''),rank:(a,b)=>a.rank-b.rank,pa:(a,b)=>n(a.price)-n(b.price),pd:(a,b)=>n(b.price)-n(a.price),vin:(a,b)=>n(b.vintage)-n(a.vintage),gr:(a,b)=>(a.grape||'').localeCompare(b.grape||''),nm:(a,b)=>a.name.localeCompare(b.name)}[s]);
  $('#ls').innerHTML=l.length?l.map(a=>`<div data-id="${a.id}"><div class="it">${a.img?`<img class="th" src="${esc(a.img)}">`:'<div class="th"></div>'}<div><b>${esc(a.name)}</b><div class="mut">${esc([a.producer,a.grape,a.vintage].filter(Boolean).join(' · '))}</div></div><span class="chip">#${a.rank}${a.tie?'=':''} · ${a.pts}p</span></div>${open===a.id?`<div style="padding:8px 0">${a.img?`<img class="big" src="${esc(a.img)}">`:''}<div>Pris: ${esc(a.price||'–')} kr · ${COL[a.color]||''} · ${esc(a.region||'')}</div><div>Placering ${a.rank}${a.tie?' (delad)':''}, ${a.pts} poäng</div><div class="mut">${esc(a.tasting)} ${esc(a.date)}</div>${(a.notes||[]).map(x=>`<div>“${esc(x)}”</div>`).join('')}<div>${link(a.link)}</div>${admin?`<button class="s sm" onclick="delA('${a.id}')">Ta bort från arkivet</button>`:''}</div>`:''}</div>`).join(''):'Inga viner i arkivet ännu.'};
 ['q','fg','ft','fc','fr','pa','pb','so'].forEach(i=>$('#'+i).oninput=render);
 $('#ls').onclick=e=>{const it=e.target.closest('.it');if(!it||e.target.closest('a'))return;const id=it.parentElement.dataset.id;open=open===id?null:id;render()};
 unsubs.push(db.collection('archive').onSnapshot(s=>{A=s.docs.map(d=>({id:d.id,...d.data()}));sel('#fg','Alla druvor',val('grape'));sel('#ft','Alla provningar',val('tasting'));sel('#fc','Alla färger',Object.keys(COL).filter(k=>A.some(a=>a.color===k)),k=>COL[k]);sel('#fr','Alla regioner',val('region'));render()}))}
async function delT(id){if(!await ask('Ta bort provningen med alla viner och röster? Det går inte att ångra.'))return;try{const t=db.doc('tastings/'+id);for(const c of['wines','votes']){const s=await t.collection(c).get();await Promise.all(s.docs.map(d=>t.collection(c).doc(d.id).delete()))}const a=await db.collection('archive').get();await Promise.all(a.docs.filter(d=>d.data().tid===id).map(d=>db.doc('archive/'+d.id).delete()));await t.delete()}catch(e){alert('Misslyckades: '+(e.message||e))}}
async function delW(t,w){if(!await ask('Ta bort vinet?'))return;try{await db.doc('tastings/'+t+'/wines/'+w).delete()}catch(e){alert('Misslyckades: '+(e.message||e))}}
async function delA(id){if(!await ask('Ta bort vinet från arkivet?'))return;try{await db.doc('archive/'+id).delete()}catch(e){alert('Misslyckades: '+(e.message||e))}}
function ask(m){return new Promise(r=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99';d.innerHTML='<div class="card" style="max-width:360px;margin:0"><p style="white-space:pre-line">'+esc(m)+'</p><div class="row"><button class="s" id="n">Avbryt</button><button id="y">OK</button></div></div>';document.body.appendChild(d);d.querySelector('#y').onclick=()=>{d.remove();r(true)};d.querySelector('#n').onclick=()=>{d.remove();r(false)}})}
window.alert=m=>{ask(String(m))};
init();
</script></body></html>
